<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Image Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="AI Image Detector logo" width="110" height="50">
        </div>
    </div>

    <div class="title2">
        <h1>AI Image Detector</h1>
    </div>

    <div class="subtitle">
        <h2>Upload an image and the trained CNN will estimate whether it was AI generated or made by a human.</h2>
    </div>

    <div class="Result-container">
        <form action="{{ url_for('result') }}" method="post" enctype="multipart/form-data">
            <label class="upload">
                <input type="file" name="image" accept="image/*" onchange="previewImage(event)">
                <img id="image-preview" src="#" alt="" style="display: none;">
                <span id="upload-text">Choose Image</span>
            </label>

            <div class="process-button-container">
                <button type="submit" id="process-btn" class="styled-button" disabled>Process</button>
            </div>
        </form>
    </div>

    <script>
        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('image-preview');
            const button = document.getElementById('process-btn');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    button.disabled = false;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
